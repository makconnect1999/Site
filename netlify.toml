# Configuração do Netlify.
# O build monta o site em dist/ a partir de public/ e das matérias em content/blog/.
# Para trocar o endereço do site (ex.: domínio próprio), mude SITE_URL abaixo.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SITE_URL = "https://makconnect.com.br"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Página de agradecimento do formulário fica fora dos buscadores.
[[headers]]
  for = "/obrigado.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/blog/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# Imagens das redes sociais: endereço público para o Instagram, fora dos buscadores.
[[headers]]
  for = "/social/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=604800"

# Endereço antigo leva ao domínio oficial (evita conteúdo duplicado no Google).
[[redirects]]
  from = "https://makconnect.netlify.app/*"
  to = "https://makconnect.com.br/:splat"
  status = 301
  force = true
