# Configuração do Netlify: site estático, sem etapa de build.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Página de agradecimento do formulário fica fora dos buscadores.
[[headers]]
  for = "/obrigado.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
